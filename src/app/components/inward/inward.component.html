<form [formGroup]="form" (ngSubmit)="onSubmit()" 
      class="container mt-4 p-4 border rounded shadow bg-light" style="max-width: 500px;">
  
  <h4 class="mb-4 text-center text-primary">Product Inward Form</h4>

  <div class="mb-3">
    <label for="productId" class="form-label">Product ID</label>
    <input id="productId" formControlName="productId" type="number" 
           class="form-control" placeholder="Enter product ID">
  </div>

  <div class="mb-3">
    <label for="quantity" class="form-label">Quantity</label>
    <input id="quantity" formControlName="quantity" type="number" 
           class="form-control" placeholder="Enter quantity">
  </div>

  <button type="submit" class="btn btn-primary w-100">Inward</button>
</form>
